// ═══════════════════════════════════════════════════════════
// MULTIPLAYER NETWORKING (PeerJS)
// ═══════════════════════════════════════════════════════════
let peer=null;
let isHost=false;
let connections=[];
let lobbyCode='';
let playerName='Player'+Math.floor(Math.random()*9999);
let remotePlayers={};
let netTick=0;

function initPeer(){
  if(peer)return;
  peer=new Peer();
  peer.on('open',id=>{
    console.log('Your Peer ID:',id);
  });
  peer.on('connection',conn=>{
    if(!isHost)return;
    connections.push(conn);
    conn.on('open',()=>{
      console.log('Player connected:',conn.peer);
      remotePlayers[conn.peer]={id:conn.peer,name:'Player'+Math.floor(Math.random()*9999),x:MAPS[selectedMap].w/2,y:MAPS[selectedMap].h/2,angle:0,hp:100,maxHp:100,alive:true,weapon:'Pistol',shooting:false};
      broadcastLobbyState();
    });
    conn.on('data',data=>handleNetData(conn,data));
    conn.on('close',()=>{
      connections=connections.filter(c=>c!==conn);
      delete remotePlayers[conn.peer];
      broadcastLobbyState();
    });
  });
  peer.on('error',err=>{
    console.error('Peer error:',err);
  });
}

function createLobby(){
  if(!peer)initPeer();
  setTimeout(()=>{
    isHost=true;
    lobbyCode=peer.id;
    state='LOBBY';
    initGame();
  },500);
}

function joinLobby(code){
  if(!code||code.length<10){alert('Invalid lobby code');return;}
  if(!peer)initPeer();
  setTimeout(()=>{
    const conn=peer.connect(code,{reliable:true});
    conn.on('open',()=>{
      connections.push(conn);
      isHost=false;
      lobbyCode=code;
      state='LOBBY';
      conn.send({type:'join',name:playerName});
    });
    conn.on('data',data=>handleNetData(conn,data));
    conn.on('error',err=>{alert('Failed to connect: '+err.type);});
  },500);
}

function handleNetData(conn,data){
  if(data.type==='playerUpdate'){
    if(!remotePlayers[conn.peer])remotePlayers[conn.peer]={};
    Object.assign(remotePlayers[conn.peer],data);
  }else if(data.type==='join'){
    remotePlayers[conn.peer]={id:conn.peer,name:data.name,x:player.x,y:player.y,angle:0,hp:100,maxHp:100,alive:true,weapon:'Pistol',shooting:false};
    broadcastLobbyState();
  }else if(data.type==='lobbyState'){
    Object.keys(data.players).forEach(pid=>{
      if(pid!==peer.id)remotePlayers[pid]=data.players[pid];
    });
  }else if(data.type==='startGame'){
    if(!isHost){
      state='PLAYING';
      waveAnn=220;
    }
  }else if(data.type==='waveStart'){
    if(!isHost){
      player.wave=data.wave;
      waveAnn=220;
    }
  }
}

function broadcastPlayerState(){
  if(!peer||connections.length===0)return;
  const data={
    type:'playerUpdate',
    x:player.x,y:player.y,angle:player.angle,
    hp:player.hp,maxHp:player.maxHp,
    weapon:player.weapon.name,
    shooting:mouse.dn,
    name:playerName
  };
  connections.forEach(c=>{if(c.open)c.send(data);});
}

function broadcastLobbyState(){
  if(!isHost)return;
  const data={type:'lobbyState',players:remotePlayers};
  connections.forEach(c=>{if(c.open)c.send(data);});
}

function broadcastWaveStart(wave){
  if(!isHost)return;
  connections.forEach(c=>{if(c.open)c.send({type:'waveStart',wave});});
}

// AUDIO
// ═══════════════════════════════════════════════════════════
let AC,ambSrc,ambGain,ambFilt;
let masterVol=0.7;
function initAudio(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();}if(AC.state==='suspended')AC.resume();}
function startAmb(type){
  if(ambSrc){try{ambSrc.stop();}catch(e){}ambSrc=null;}
  if(!AC)return;
  ambGain=AC.createGain();ambGain.gain.value=masterVol;ambGain.connect(AC.destination);
  const osc=(f,v,t='sine')=>{ambSrc=AC.createOscillator();ambSrc.type=t;ambSrc.frequency.value=f;ambGain.gain.value=v*masterVol;ambSrc.connect(ambGain);ambSrc.start();};
  const nz=(ft,f,Q,v,d=4)=>{const sz=AC.sampleRate*d,buf=AC.createBuffer(1,sz,AC.sampleRate),da=buf.getChannelData(0);for(let i=0;i<sz;i++)da[i]=Math.random()*2-1;ambSrc=AC.createBufferSource();ambSrc.buffer=buf;ambSrc.loop=true;ambFilt=AC.createBiquadFilter();ambFilt.type=ft;ambFilt.frequency.value=f;if(Q)ambFilt.Q.value=Q;ambGain.gain.value=v*masterVol;ambSrc.connect(ambFilt);ambFilt.connect(ambGain);ambSrc.start();};
  if(type==='hum')osc(55,0.45,'sine');
  else if(type==='crickets'){const sz=AC.sampleRate*4,buf=AC.createBuffer(1,sz,AC.sampleRate),da=buf.getChannelData(0);for(let i=0;i<sz;i++)da[i]=(Math.random()-.5)*(i%280<25?1.1:.35);ambSrc=AC.createBufferSource();ambSrc.buffer=buf;ambSrc.loop=true;ambFilt=AC.createBiquadFilter();ambFilt.type='bandpass';ambFilt.frequency.value=4900;ambFilt.Q.value=14;ambGain.gain.value=.1*masterVol;ambSrc.connect(ambFilt);ambFilt.connect(ambGain);ambSrc.start();}
  else if(type==='wind')nz('lowpass',320,null,.8,5);
  else if(type==='cave')osc(35,.4,'sine');
  else if(type==='rain')nz('highpass',1200,null,.14,3);
  else if(type==='desert')nz('lowpass',180,null,.5,6);
}
function stopAmb(){if(ambSrc){try{ambSrc.stop();}catch(e){}ambSrc=null;}}
function sfx(type,vol=1){
  if(!AC)return;vol*=masterVol;
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);const n=AC.currentTime;
  const go=(t,f1,f2,d,v,ramp='exponentialRampToValueAtTime')=>{o.type=t;o.frequency.setValueAtTime(f1,n);o.frequency[ramp](Math.max(0.01,f2),n+d);g.gain.setValueAtTime(v*vol,n);g.gain.exponentialRampToValueAtTime(0.001,n+d);o.start(n);o.stop(n+d);};
  if(type==='pistol')go('square',280,40,.1,.12);
  else if(type==='shotgun')go('sawtooth',140,20,.25,.25);
  else if(type==='rifle')go('square',320,55,.07,.1);
  else if(type==='mg')go('square',380,70,.05,.08);
  else if(type==='sniper')go('square',600,30,.15,.18);
  else if(type==='plasma')go('sine',800,200,.2,.15);
  else if(type==='smg')go('square',260,60,.04,.07);
  else if(type==='flame')go('sawtooth',80+Math.random()*40,60,.12,.07);
  else if(type==='hit')go('sawtooth',90,30,.12,.18,'linearRampToValueAtTime');
  else if(type==='boom')go('square',90,8,.6,.45);
  else if(type==='heli'){o.type='triangle';o.frequency.setValueAtTime(38,n);g.gain.setValueAtTime(.06*vol,n);g.gain.linearRampToValueAtTime(0,n+.6);o.start(n);o.stop(n+.6);}
  else if(type==='pup')go('sine',400,800,.3,.12,'linearRampToValueAtTime');
  else if(type==='shield')go('triangle',600,300,.1,.1);
  else if(type==='stomp')go('square',60,15,.3,.3);
  else if(type==='morph'){o.type='sawtooth';o.frequency.setValueAtTime(200,n);o.frequency.linearRampToValueAtTime(1000,n+.4);g.gain.setValueAtTime(.12*vol,n);g.gain.linearRampToValueAtTime(0,n+.4);o.start(n);o.stop(n+.4);}
  else if(type==='levelup'){o.type='sine';o.frequency.setValueAtTime(300,n);o.frequency.linearRampToValueAtTime(900,n+.5);g.gain.setValueAtTime(.15*vol,n);g.gain.linearRampToValueAtTime(0,n+.5);o.start(n);o.stop(n+.5);}
  else if(type==='crit'){o.type='square';o.frequency.setValueAtTime(800,n);o.frequency.exponentialRampToValueAtTime(400,n+.08);g.gain.setValueAtTime(.1*vol,n);g.gain.exponentialRampToValueAtTime(.001,n+.08);o.start(n);o.stop(n+.08);}
  else if(type==='dash'){o.type='sine';o.frequency.setValueAtTime(500,n);o.frequency.linearRampToValueAtTime(200,n+.15);g.gain.setValueAtTime(.08*vol,n);g.gain.linearRampToValueAtTime(0,n+.15);o.start(n);o.stop(n+.15);}
  else if(type==='buy')go('sine',600,1200,.2,.1,'linearRampToValueAtTime');
  else if(type==='boss_warn'){o.type='sawtooth';o.frequency.setValueAtTime(100,n);o.frequency.linearRampToValueAtTime(50,n+1);g.gain.setValueAtTime(.2*vol,n);g.gain.linearRampToValueAtTime(0,n+1);o.start(n);o.stop(n+1);}
}

function initPlayer(){
  const m=MAPS[selectedMap];
  const D=DIFFICULTIES[difficulty];
  player={
    x:m.w/2,y:m.h/2,radius:15,angle:0,
    vx:0,vy:0,speed:2.4,friction:.8,maxSpeed:5.0,
    hp:100*D.hpMult,maxHp:100*D.hpMult,
    stamina:100,maxStamina:100,
    shield:0,shieldMax:50,
    weapon:WEAPONS.pistol,ammo:12,resAmmo:180,
    reloading:false,relTimer:0,relPct:0,
    score:0,kills:0,wave:1,lastShot:0,streak:0,lastKill:0,
    fx:{speed:0,shield:0,damage:0,regen:0,invis:0,magnet:0},
    invTimer:0,burnTimer:0,
    grenades:3,lastGrenade:0,maxGrenades:6,
    dashes:3,lastDash:0,dashing:false,dashVx:0,dashVy:0,dashTimer:0,maxDashes:3,
    xp:0,xpNext:100,level:1,permDmgMult:1.0,passiveRegen:0,critChance:0.05,xpMult:1.0,passiveShield:0,
    bossKills:0,titanKills:0,nukeUsed:false,perfectWave:true,meleeKills:0,
    faction:'player',morphType:null,morphTimer:0,
  };
}

function initGame(){
  const m=MAPS[selectedMap];
  m.obs.forEach(o=>{o.decals=[];});
  initPlayer();
  bullets=[];enemies=[];particles=[];bloodPools=[];grenades=[];rockets=[];flames=[];dmgNums=[];
  powerups=[];crates=[];lavaParts=[];weatherParts=[];
  pendingAchievements=[];
  heli.active=false;isInter=false;inShop=false;pausedForPerk=false;perkChoices=[];
  sShake=0;sFlash={a:0,col:'#fff'};
  prevWaveHp=player.hp;
  startAmb(m.amb);
  if(gameMode==='SURVIVAL'||isHost){
    state='PLAYING';waveAnn=220;
    spawnWave();
  }
  m.pups.forEach(p=>{if(!inObs(p.x,p.y,m))spawnPup(p.x,p.y);});
  HS.gamesPlayed++;saveHS();
}

function inObs(x,y,m){for(let o of m.obs)if(x>o.x-20&&x<o.x+o.w+20&&y>o.y-20&&y<o.y+o.h+20)return true;return false;}
function spawnPup(x,y){const t=PTYPES[Math.floor(Math.random()*PTYPES.length)];powerups.push({x,y,type:t,pulse:0,dead:false,resp:500});}

// INPUT
// ═══════════════════════════════════════════════════════════
window.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(state==='MENU'){
    if(e.code==='Digit1'&&menuTab===0){selectedMap=0;initAudio();gameMode='SURVIVAL';initGame();}
    if(e.code==='Digit2'&&menuTab===0){selectedMap=1;initAudio();gameMode='SURVIVAL';initGame();}
    if(e.code==='Digit3'&&menuTab===0){selectedMap=2;initAudio();gameMode='SURVIVAL';initGame();}
    if(e.code==='Digit4'&&menuTab===0){selectedMap=3;initAudio();gameMode='SURVIVAL';initGame();}
    if(e.code==='Digit5'&&menuTab===0){selectedMap=4;initAudio();gameMode='SURVIVAL';initGame();}
    if(e.code==='Digit6'&&menuTab===0){selectedMap=5;initAudio();gameMode='SURVIVAL';initGame();}
  }
  if(state==='GAMEOVER'&&(e.code==='Space'||e.code==='Enter')){state='MENU';stopAmb();}
  if(state==='LEVELUP'){
    if(e.code==='Digit1'&&perkChoices[0])choosePerk(0);
    if(e.code==='Digit2'&&perkChoices[1])choosePerk(1);
    if(e.code==='Digit3'&&perkChoices[2])choosePerk(2);
  }
  if(state==='PLAYING'){
    if(e.code==='Escape'){
      if(gameMode==='SANDBOX')sandbox.open=!sandbox.open;
      else if(state==='PLAYING'){state='PAUSED';}
    }
    if(inShop&&!sandbox.open){
      const shopItems=[['smg',550],['smg2',0],['rifle',800],['rifle2',0],['shotgun',650],['shotgun2',0],['sniper',1200],['plasma',1800],['flame',1600],['launcher',2200],['chainsaw',1100],['katana',900],['akimbo',1300],['grenadel',1700],['dblshot',480],['mgun',1400]];
      const dk=['Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8','Digit9','Digit0','KeyQ','KeyZ','KeyX','KeyC','KeyB','KeyN'];
      dk.forEach((k,i)=>{if(e.code===k&&i<shopItems.length){const[id,pr]=shopItems[i];if(pr>0&&player.score>=pr)buyWeap(id);else if(pr===0&&player.weapon.upgTo&&player.score>=player.weapon.upgCost)upgradeWeap();}});
      if(e.code==='KeyH'&&player.score>=400){player.score-=400;player.hp=Math.min(player.maxHp,player.hp+80);sfx('pup');}
      if(e.code==='KeyG'&&player.score>=200&&player.grenades<player.maxGrenades){player.score-=200;player.grenades+=3;sfx('pup');}
      if(e.code==='KeyE'||e.code==='Escape'){inShop=false;}
    } else if(!inShop){
      if(e.code==='KeyR'&&!player.reloading&&player.ammo<player.weapon.mag&&player.resAmmo>0&&!player.weapon.melee){player.reloading=true;player.relTimer=player.weapon.rel;player.relPct=0;}
      if(e.code==='KeyF'&&player.grenades>0&&Date.now()-player.lastGrenade>800)doGrenade();
      if(e.code==='Space'&&player.dashes>0&&Date.now()-player.lastDash>900)doDash();
      if(e.code==='KeyE'&&nearCrate&&!sandbox.open){inShop=true;}
    }
    if(gameMode==='SANDBOX'&&sandbox.open){
      if(e.code==='KeyA')sandbox.aiEnabled=!sandbox.aiEnabled;
      if(e.code==='KeyC')enemies=[];
      if(e.code==='Tab'){e.preventDefault();sandbox.tab=(sandbox.tab+1)%3;}
    }
    if(e.code==='KeyV'&&gameMode==='SANDBOX')tryFaction();
  }
  if(state==='PAUSED'&&e.code==='Escape'){state='PLAYING';}
});
window.addEventListener('keyup',e=>keys[e.code]=false);
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();const s=canvas._s||1;mouse.x=(e.clientX-r.left)/s;mouse.y=(e.clientY-r.top)/s;});
canvas.addEventListener('mousedown',e=>{mouse.dn=true;initAudio();handleClick(e);});
canvas.addEventListener('mouseup',()=>mouse.dn=false);

function handleClick(e){
  if(state==='MENU')handleMenuClick();
  if(state==='LOBBY')handleLobbyClick();
  if(state==='LEVELUP')handlePerkClick();
  if(state==='PLAYING'&&gameMode==='SANDBOX'&&sandbox.open&&sandbox.cursor.active){
    spawnEnemy(mouse.wx,mouse.wy,sandbox.cursor.type,sandbox.cursor.faction);
  }
  if(state==='PAUSED'&&mouse.x>W/2-80&&mouse.x<W/2+80&&mouse.y>H/2+20&&mouse.y<H/2+60){state='MENU';stopAmb();}
}

function handleMenuClick(){
  const tabs=[[160,280],[360,280],[560,280],[760,280]];
  tabs.forEach((t,i)=>{
    if(mouse.x>t[0]-90&&mouse.x<t[0]+90&&mouse.y>t[1]-18&&mouse.y<t[1]+12)menuTab=i;
  });
  
  Object.entries(DIFFICULTIES).forEach(([k,d],i)=>{
    const bx=155+i*150,by=302;
    if(mouse.x>bx-4&&mouse.x<bx+136&&mouse.y>by-16&&mouse.y<by+16)difficulty=k;
  });
  
  if(menuTab===0){
    MAPS.forEach((m,i)=>{
      const c=i%3,r=Math.floor(i/3);const mx=180+c*302,my=390+r*130;
      if(mouse.x>mx-140&&mouse.x<mx+140&&mouse.y>my-42&&mouse.y<my+84){
        selectedMap=i;initAudio();gameMode='SURVIVAL';initGame();
      }
    });
  }
  
  if(menuTab===1){
    if(mouse.x>W/2-150&&mouse.x<W/2+150&&mouse.y>400&&mouse.y<450){
      initAudio();createLobby();
    }
    if(mouse.x>W/2-150&&mouse.x<W/2+150&&mouse.y>470&&mouse.y<520){
      const code=prompt('Enter lobby code:');
      if(code)joinLobby(code);
    }
  }
  
  if(menuTab===2){
    MAPS.forEach((m,i)=>{
      const c=i%3,r=Math.floor(i/3);const mx=180+c*302,my=390+r*130;
      if(mouse.x>mx-140&&mouse.x<mx+140&&mouse.y>my-42&&mouse.y<my+84){
        selectedMap=i;initAudio();gameMode='SANDBOX';sandbox.aiEnabled=true;sandbox.open=false;sandbox.cursor={active:false,type:0,faction:'reborn'};initGame();
      }
    });
  }
}

function handleLobbyClick(){
  if(isHost&&mouse.x>W/2-100&&mouse.x<W/2+100&&mouse.y>H-100&&mouse.y<H-50){
    state='PLAYING';
    broadcastWaveStart(1);
  }
}

function handlePerkClick(){
  perkChoices.forEach((p,i)=>{
    const bx=W/2-320+i*220,by=H/2-30;
    if(mouse.x>bx&&mouse.x<bx+200&&mouse.y>by&&mouse.y<by+180)choosePerk(i);
  });
}

function choosePerk(i){
  if(!perkChoices[i])return;
  perkChoices[i].apply();
  perkChoices=[];
  state='PLAYING';
  sfx('levelup');
}

function buyWeap(id){const w=WEAPONS[id];if(!w||w.price>player.score)return;player.score-=w.price;player.weapon=w;player.ammo=w.mag;player.resAmmo=w.mag*(w.melee?1:6);sfx('buy');}
function upgradeWeap(){
  const w=player.weapon;if(!w.upgTo||player.score<w.upgCost)return;
  player.score-=w.upgCost;player.weapon=WEAPONS[w.upgTo];player.ammo=player.weapon.mag;
  sfx('levelup');spawnPart(player.x,player.y,'#ffcc00',20,1.5);
  addDmgNum(player.x,player.y-30,'UPGRADED!',{r:255,g:200,b:0},24);
}

function doGrenade(){
  player.grenades--;player.lastGrenade=Date.now();
  grenades.push({x:player.x+Math.cos(player.angle)*25,y:player.y+Math.sin(player.angle)*25,z:8,vx:Math.cos(player.angle)*12,vy:Math.sin(player.angle)*12,vz:5.5,timer:90,owner:player.faction});
}

function doDash(){
  let mx=0,my=0;
  if(keys['KeyW']||keys['ArrowUp'])my-=1;if(keys['KeyS']||keys['ArrowDown'])my+=1;
  if(keys['KeyA']||keys['ArrowLeft'])mx-=1;if(keys['KeyD']||keys['ArrowRight'])mx+=1;
  if(!mx&&!my){mx=Math.cos(player.angle);my=Math.sin(player.angle);}
  const l=Math.hypot(mx,my);mx/=l;my/=l;
  player.dashing=true;player.dashVx=mx*24;player.dashVy=my*24;player.dashTimer=12;

function tryFaction(){

function morphInto(type){

function spawnWave(){
  const wave=player.wave,D=DIFFICULTIES[difficulty];
  const count=Math.min(6+wave*6,90);
  if(wave%5===0){spawnBoss();sfx('boss_warn');}
  if(wave%10===0)spawnTitan();
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,d=500+Math.random()*500;
    const m=MAPS[selectedMap];
    let x=Math.max(80,Math.min(m.w-80,player.x+Math.cos(a)*d));
    let y=Math.max(80,Math.min(m.h-80,player.y+Math.sin(a)*d));
    const t=pickType(wave);
    if(t===11){for(let j=0;j<5;j++)spawnEnemy(x+(Math.random()-.5)*80,y+(Math.random()-.5)*80,11,'reborn');}
    else spawnEnemy(x,y,t,'reborn');
  }
  prevWaveHp=player.hp;
  player.perfectWave=true;
  if(player.passiveShield){player.fx.shield=300;player.shield=player.shieldMax;}
  if(isHost)broadcastWaveStart(wave);
}

function pickType(wave){
  const r=Math.random();
  if(wave>=10&&r<.07)return 13;
  if(wave>=8&&r<.09)return 12;
  if(wave>=6&&r<.11)return 10;
  if(wave>=5&&r<.11)return 9;
  if(wave>=4&&r<.13)return 8;
  if(wave>=3&&r<.13)return 7;
  if(wave>=3&&r<.12)return 11;
  if(wave>=2&&r<.18)return 1;
  if(wave>=3&&r<.14)return 2;
  if(wave>=2&&r<.10)return 3;
  if(wave>=3&&r<.08)return 4;
  return 0;
}

function spawnEnemy(x,y,type,faction='reborn'){
  const def=EDEFS[type]||EDEFS[0];
  const wave=player.wave||1;
  const D=DIFFICULTIES[difficulty];
  const hpS=gameMode==='SANDBOX'?1:(1+wave*.07)*D.dmgMult;
  const hp=Math.round(def.hp*hpS);
  enemies.push({x,y,radius:def.r,hp,maxHp:hp,speed:def.spd+(gameMode==='SURVIVAL'?(wave-1)*.05:0),type,def,faction,lastFire:0,lastAttack:0,lastSp:0,ang:0,burnTimer:0,slowTimer:0,charging:false,chargeDir:null,chargeTimer:0,alpha:1,isBoss:!!def.boss});
}

function spawnBoss(){spawnEnemy(player.x+(Math.random()<.5?-700:700),player.y+(Math.random()<.5?-700:700),Math.random()>.5?5:6,'reborn');}
function spawnTitan(){spawnEnemy(player.x+(Math.random()<.5?-1000:1000),player.y+(Math.random()<.5?-1000:1000),14,'reborn');}

function rCol(e,r){
  let tx=e.x,ty=e.y;
  if(e.x<r.x)tx=r.x;else if(e.x>r.x+r.w)tx=r.x+r.w;
  if(e.y<r.y)ty=r.y;else if(e.y>r.y+r.h)ty=r.y+r.h;
  const dx=e.x-tx,dy=e.y-ty,d=Math.hypot(dx,dy);
  if(d<e.radius){const ov=e.radius-d;e.x+=(dx/d||0)*ov;e.y+=(dy/d||0)*ov;return true;}return false;
}
function cRect(cx,cy,r,rx,ry,rw,rh){let tx=cx,ty=cy;if(cx<rx)tx=rx;else if(cx>rx+rw)tx=rx+rw;if(cy<ry)ty=ry;else if(cy>ry+rh)ty=ry+rh;return Math.hypot(cx-tx,cy-ty)<r;}
function spawnPart(x,y,col,n=1,spd=1,dec=null){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*10*spd,vy:(Math.random()-.5)*10*spd,r:Math.random()*3+1,a:1,dec:dec||Math.random()*.03+.015,col});}
function addDmgNum(x,y,txt,rgb,size=18,isCrit=false){dmgNums.push({x,y,txt:String(txt),r:rgb.r,g:rgb.g,b:rgb.b,a:1,vy:-2.5,size,isCrit,life:90});}
function blood(x,y,n=6){
  sfx('hit',.7);
  const m=MAPS[selectedMap];
  m.obs.forEach(o=>{if(!o.decals)o.decals=[];if(x>o.x-30&&x<o.x+o.w+30&&y>o.y-30&&y<o.y+o.h+30)o.decals.push({x:x-o.x,y:y-o.y+(Math.random()*8-4),r:Math.random()*7+3,c:'rgba(110,0,0,0.9)'});});
  for(let i=0;i<n;i++)bloodPools.push({x:x+(Math.random()-.5)*44,y:y+(Math.random()-.5)*44,r:Math.random()*12+5,d:Math.random()*.7+.3});
}
function boom(x,y,rad=90,dmg=55,ownerFaction='player'){
  sfx('boom');sShake=Math.max(sShake,18);sFlash={a:.35,col:'#ff6600'};
  spawnPart(x,y,'#ff5500',35,2.2);spawnPart(x,y,'#ffaa00',20,1.8);spawnPart(x,y,'#444',18,1.4);
  const pd=Math.hypot(player.x-x,player.y-y);
  const hurtP=(ownerFaction==='reborn'&&player.faction==='player')||(ownerFaction==='player'&&player.faction==='reborn');
  if(hurtP&&pd<rad&&player.fx.shield<=0&&player.invTimer<=0){
    const d=dmg*(1-pd/rad);player.hp-=d;blood(player.x,player.y,3);
    addDmgNum(player.x,player.y-20,Math.ceil(d),{r:255,g:80,b:80});
    if(player.hp<=0)killPlayer();
  }
  for(let i=enemies.length-1;i>=0;i--){
    const z=enemies[i];
    if(z.faction!==ownerFaction&&Math.hypot(z.x-x,z.y-y)<rad){z.hp-=dmg;if(z.hp<=0)killEnemy(i);}
  }
}
function killPlayer(){
  state='GAMEOVER';stopAmb();sFlash={a:1,col:'#ff0000'};
  HS.highScore=Math.max(HS.highScore,player.score);
  HS.bestWave=Math.max(HS.bestWave,player.wave);
  HS.totalKills+=player.kills;
  saveHS();
}
function gainXP(amount){
  player.xp+=amount*player.xpMult;
  while(player.xp>=player.xpNext){
    player.xp-=player.xpNext;player.xpNext=Math.round(player.xpNext*1.4);player.level++;
    sfx('levelup');spawnPart(player.x,player.y,'#ffcc00',25,1.8);
    addDmgNum(player.x,player.y-40,'LEVEL UP!',{r:255,g:200,b:0},22,true);
    offerPerks();
  }
}
function offerPerks(){
  const shuffled=[...PERKS].sort(()=>Math.random()-.5);
  perkChoices=shuffled.slice(0,3);
  state='LEVELUP';
}
function killEnemy(i){
  if(i<0||i>=enemies.length)return;
  const z=enemies[i];
  blood(z.x,z.y,z.isBoss?15:6);
  if(z.faction!==player.faction){
    const D=DIFFICULTIES[difficulty];
    const bonus=player.streak>=10?2:player.streak>=5?1.5:1;
    player.score+=Math.round(z.def.score*D.scoreMult*bonus);
    player.kills++;player.streak++;player.lastKill=Date.now();
    HS.totalKills++;
    gainXP(z.def.xp);
    if(z.isBoss){player.bossKills++;if(z.def.titan)player.titanKills++;}
    if(player.weapon.melee)player.meleeKills++;
    checkAchievements();
  }
  if(Math.random()<(z.isBoss?.7:.15)){const t=PTYPES[Math.floor(Math.random()*PTYPES.length)];powerups.push({x:z.x,y:z.y,type:t,pulse:0,dead:false,resp:-1});}
  enemies.splice(i,1);
  if(z.isBoss){sFlash={a:.5,col:'#ffaa00'};sShake=25;addDmgNum(z.x,z.y-30,'BOSS DOWN!',{r:255,g:170,b:0},26,true);}
}
function applyPup(t){
  sfx('pup');
  if(t.id==='health'){player.hp=Math.min(player.maxHp,player.hp+60);addDmgNum(player.x,player.y-20,'+60 HP',{r:100,g:255,b:100},18);}
  else if(t.id==='ammo'){player.resAmmo+=120;player.grenades=Math.min(player.maxGrenades,player.grenades+3);}
  else if(t.id==='speed')player.fx.speed=t.dur;
  else if(t.id==='shield'){player.fx.shield=t.dur;player.shield=player.shieldMax;}
  else if(t.id==='damage')player.fx.damage=t.dur;
  else if(t.id==='freeze'){enemies.forEach(z=>z.slowTimer=300);sFlash={a:.4,col:'#aaddff'};spawnPart(player.x,player.y,'#aaddff',20,1.5);}
  else if(t.id==='nuke'){
    player.nukeUsed=true;
    for(let i=enemies.length-1;i>=0;i--){
      if(!enemies[i].isBoss&&enemies[i].faction!==player.faction){blood(enemies[i].x,enemies[i].y,8);player.score+=enemies[i].def.score;player.kills++;enemies.splice(i,1);}
      else if(enemies[i].faction!==player.faction)enemies[i].hp=Math.max(1,enemies[i].hp-200);
    }
    sFlash={a:.9,col:'#ff0044'};sShake=35;
    addDmgNum(player.x,player.y-50,'☢ NUKE!',{r:255,g:0,b:68},30,true);
    checkAchievements();
  }
  else if(t.id==='regen')player.fx.regen=t.dur;
  else if(t.id==='invis')player.fx.invis=t.dur;
  else if(t.id==='magnet')player.fx.magnet=t.dur;
}
function spawnCrate(x,y){
  const m=MAPS[selectedMap];let cx=x,cy=y;
  for(let i=0;i<30;i++){let safe=true;for(let o of m.obs)if(cx>o.x-50&&cx<o.x+o.w+50&&cy>o.y-50&&cy<o.y+o.h+50){safe=false;break;}if(safe)break;cx=x+(Math.random()-.5)*280;cy=y+(Math.random()-.5)*280;}
  crates.push({x:Math.max(70,Math.min(m.w-70,cx)),y:Math.max(70,Math.min(m.h-70,cy)),size:24,pulse:0});
}
function callHeli(){if(heli.active)return;heli.active=true;heli.state='entering';heli.x=player.x-1800;heli.y=player.y-1400;heli.tx=player.x+(Math.random()*300-150);heli.ty=player.y+(Math.random()*300-150);}

// ═══════════════════════════════════════════════════════════
// UPDATE
// ═══════════════════════════════════════════════════════════
function update(){
  frame++;
  if(state==='LEVELUP'||state==='PAUSED'||state==='LOBBY')return;
  if(state!=='PLAYING')return;
  if(sandbox.open&&gameMode==='SANDBOX')return;
  const m=MAPS[selectedMap],now=Date.now(),D=DIFFICULTIES[difficulty];

  if(now-player.lastKill>4000)player.streak=0;
  if(sShake>0)sShake*=.82;if(sFlash.a>0)sFlash.a-=.03;

  if(player.passiveRegen>0&&frame%60===0)player.hp=Math.min(player.maxHp,player.hp+player.passiveRegen);

  if(gameMode==='SURVIVAL'&&enemies.length===0&&!isInter){
    isInter=true;interTimer=INTER_DUR;
    player.resAmmo+=player.weapon.mag*4;player.grenades=Math.min(player.maxGrenades,player.grenades+2);
    if(player.perfectWave)addDmgNum(player.x,player.y-50,'PERFECT WAVE!',{r:255,g:220,b:0},22,true);
    checkAchievements();
    if(player.wave%3===0)callHeli();else spawnCrate(player.x+(Math.random()-.5)*350,player.y+(Math.random()-.5)*350);
    if(player.wave%5===0){player.maxHp=Math.min(300,player.maxHp+10);player.hp=player.maxHp;}
  }
  if(isInter){interTimer--;if(interTimer<=0){isInter=false;inShop=false;player.wave++;waveAnn=220;spawnWave();}}

  if(player.fx.regen>0){player.hp=Math.min(player.maxHp,player.hp+.08);player.fx.regen--;}
  if(player.burnTimer>0){player.burnTimer--;if(frame%20===0){player.hp-=2;spawnPart(player.x,player.y,'#ff4400',3,.8);if(player.hp<=0)killPlayer();}}
  for(let k in player.fx)if(player.fx[k]>0)player.fx[k]--;
  if(player.invTimer>0)player.invTimer--;
  if(waveAnn>0)waveAnn--;

  if(player.fx.magnet>0){
    powerups.forEach(p=>{if(p.dead)return;const d=Math.hypot(p.x-player.x,p.y-player.y);if(d<300&&d>1){p.x+=(player.x-p.x)/d*5;p.y+=(player.y-p.y)/d*5;}});
  }

  let mx=0,my=0;
  if(keys['KeyW']||keys['ArrowUp'])my-=1;if(keys['KeyS']||keys['ArrowDown'])my+=1;
  if(keys['KeyA']||keys['ArrowLeft'])mx-=1;if(keys['KeyD']||keys['ArrowRight'])mx+=1;
  if(mx&&my){const l=Math.hypot(mx,my);mx/=l;my/=l;}
  const spr=keys['ShiftLeft']&&player.stamina>5&&(mx||my);
  const spdM=(player.fx.speed>0?1.45:1)*(spr?1.75:1);
  const maxSp=player.maxSpeed*spdM;
  if(spr)player.stamina=Math.max(0,player.stamina-.9);else player.stamina=Math.min(player.maxStamina,player.stamina+.55);
  if(player.dashing){player.vx=player.dashVx;player.vy=player.dashVy;player.dashTimer--;if(player.dashTimer<=0)player.dashing=false;}
  else{player.vx+=mx*player.speed;player.vy+=my*player.speed;const spd=Math.hypot(player.vx,player.vy);if(spd>maxSp){player.vx=player.vx/spd*maxSp;player.vy=player.vy/spd*maxSp;}}
  player.vx*=player.friction;player.vy*=player.friction;
  player.x+=player.vx;player.y+=player.vy;
  if(player.dashing&&frame%3===0)spawnPart(player.x,player.y,'#4488ff',4,.8);
  if(!player.dashing&&player.dashes<player.maxDashes&&now-player.lastDash>2800){player.dashes=Math.min(player.maxDashes,player.dashes+1);player.lastDash=now;}

  if(player.morphTimer>0){player.morphTimer--;if(player.morphTimer<=0){player.morphType=null;player.maxHp=100;player.hp=Math.min(100,player.hp);player.maxSpeed=5;player.radius=15;}}

  m.obs.forEach(o=>{
    rCol(player,o);
    if(o.lava&&cRect(player.x,player.y,player.radius,o.x,o.y,o.w,o.h)&&frame%30===0&&player.invTimer<=0){player.hp-=3;player.burnTimer=60;if(player.hp<=0)killPlayer();}
  });
  player.x=Math.max(player.radius,Math.min(m.w-player.radius,player.x));
  player.y=Math.max(player.radius,Math.min(m.h-player.radius,player.y));

  const tcx=player.x-W/2,tcy=player.y-H/2;
  cam.x+=(tcx-cam.x)*.12;cam.y+=(tcy-cam.y)*.12;
  cam.x=Math.max(0,Math.min(m.w-W,cam.x));cam.y=Math.max(0,Math.min(m.h-H,cam.y));
  mouse.wx=mouse.x+cam.x;mouse.wy=mouse.y+cam.y;
  player.angle=Math.atan2(mouse.wy-player.y,mouse.wx-player.x);

  nearCrate=false;
  crates.forEach(c=>{c.pulse=(frame*.08)%Math.PI*2;if(Math.hypot(player.x-c.x,player.y-c.y)<90)nearCrate=true;});
  if(!nearCrate)inShop=false;

  for(let i=powerups.length-1;i>=0;i--){
    const p=powerups[i];p.pulse=(frame*.06)%(Math.PI*2);
    if(p.dead){if(p.resp>0){p.resp--;if(p.resp<=0){p.dead=false;p.type=PTYPES[Math.floor(Math.random()*PTYPES.length)];}}else{powerups.splice(i,1);continue;}}
    if(!p.dead&&Math.hypot(player.x-p.x,player.y-p.y)<28){applyPup(p.type);p.dead=true;}
  }

  const autoFire=!player.weapon.melee&&player.weapon!==WEAPONS.pistol&&player.weapon!==WEAPONS.pistol2&&player.weapon!==WEAPONS.shotgun&&player.weapon!==WEAPONS.shotgun2&&player.weapon!==WEAPONS.dblshot&&player.weapon!==WEAPONS.sniper&&player.weapon!==WEAPONS.sniper2&&player.weapon!==WEAPONS.launcher&&player.weapon!==WEAPONS.grenadel&&player.weapon!==WEAPONS.katana&&player.weapon!==WEAPONS.katana2;
  const trig=autoFire?mouse.dn:(mouse.dn&&!mouse.last);mouse.last=mouse.dn;
  if(keys['KeyR']&&!player.reloading&&player.ammo<player.weapon.mag&&player.resAmmo>0&&!player.weapon.melee){player.reloading=true;player.relTimer=player.weapon.rel;player.relPct=0;}
  if(player.reloading){player.relTimer--;player.relPct=1-player.relTimer/player.weapon.rel;if(player.relTimer<=0){const need=player.weapon.mag-player.ammo;const take=Math.min(need,player.resAmmo);player.ammo+=take;player.resAmmo-=take;player.reloading=false;player.relPct=0;}}
  const dmgM=(player.fx.damage>0?1.6:1)*player.permDmgMult*D.dmgMult;

  if(trig&&player.ammo>0&&!player.reloading&&now-player.lastShot>player.weapon.fr&&!inShop&&!sandbox.open){
    player.ammo--;player.lastShot=now;
    sShake=Math.max(sShake,player.weapon===WEAPONS.shotgun||player.weapon===WEAPONS.shotgun2||player.weapon===WEAPONS.dblshot?14:player.weapon===WEAPONS.mgun||player.weapon===WEAPONS.mgun2?7:player.weapon===WEAPONS.launcher?20:5);
    sfx(player.weapon.sfx,.85);
    if(player.weapon.melee){
      const range=player.weapon===WEAPONS.katana||player.weapon===WEAPONS.katana2?72:55;
      enemies.forEach(z=>{if(z.faction!==player.faction&&Math.hypot(z.x-player.x,z.y-player.y)<range){const isCrit=Math.random()<player.critChance;const d=(player.weapon.dmg*dmgM)*(isCrit?2:1);z.hp-=d;spawnPart(z.x,z.y,isCrit?'#ffcc00':'#cc0000',isCrit?10:6,1);addDmgNum(z.x,z.y-20,Math.ceil(d),isCrit?{r:255,g:200,b:0}:{r:255,g:100,b:100},isCrit?22:16,isCrit);if(isCrit)sfx('crit');if(z.hp<=0)killEnemy(enemies.indexOf(z));}});
      spawnPart(player.x+Math.cos(player.angle)*40,player.y+Math.sin(player.angle)*40,'#ff8800',8);
    }else if(player.weapon.proj==='flame'){
      for(let b=0;b<player.weapon.bul;b++){const sp=(Math.random()-.5)*player.weapon.sp*2;flames.push({x:player.x+Math.cos(player.angle)*22,y:player.y+Math.sin(player.angle)*22,vx:Math.cos(player.angle+sp)*9+(Math.random()-.5)*2,vy:Math.sin(player.angle+sp)*9+(Math.random()-.5)*2,r:7+Math.random()*5,life:1,dmg:player.weapon.dmg*dmgM,owner:player.faction});}
    }else if(player.weapon.proj==='rocket'){
      const sp=(Math.random()-.5)*player.weapon.sp;rockets.push({x:player.x+Math.cos(player.angle)*28,y:player.y+Math.sin(player.angle)*28,vx:Math.cos(player.angle+sp)*18,vy:Math.sin(player.angle+sp)*18,r:5,dmg:player.weapon.dmg*dmgM,ang:player.angle,life:200,owner:player.faction});
    }else if(player.weapon.proj==='grenade'){
      const sp=(Math.random()-.5)*player.weapon.sp;grenades.push({x:player.x+Math.cos(player.angle)*25,y:player.y+Math.sin(player.angle)*25,z:8,vx:Math.cos(player.angle+sp)*14,vy:Math.sin(player.angle+sp)*14,vz:5.5,timer:70,owner:player.faction});
    }else{
      for(let b=0;b<player.weapon.bul;b++){
        const sp=(Math.random()-.5)*player.weapon.sp;
        bullets.push({x:player.x+Math.cos(player.angle)*28,y:player.y+Math.sin(player.angle)*28,vx:Math.cos(player.angle+sp)*27,vy:Math.sin(player.angle+sp)*27,r:player.weapon===WEAPONS.sniper||player.weapon===WEAPONS.sniper2?4:3,dmg:player.weapon.dmg*dmgM,pierce:player.weapon.special==='pierce',aoe:player.weapon.special==='aoe',col:player.weapon.col||'#ffdd44',owner:player.faction,critChance:player.critChance});
      }
    }
    spawnPart(player.x+Math.cos(player.angle)*26,player.y+Math.sin(player.angle)*26,'#ffdd44',5);
  }

  if(heli.active){
    if(Math.random()<.1)sfx('heli',.5);
    heli.ang=Math.atan2(heli.ty-heli.y,heli.tx-heli.x);
    const hs=heli.state==='entering'?12:14;
    heli.x+=Math.cos(heli.ang)*hs;heli.y+=Math.sin(heli.ang)*hs;
    if(heli.state==='entering'&&Math.hypot(heli.tx-heli.x,heli.ty-heli.y)<45){spawnCrate(heli.x,heli.y);heli.state='leaving';heli.tx=heli.x+2500;heli.ty=heli.y-2000;}
    else if(heli.state==='leaving'&&Math.hypot(heli.tx-heli.x,heli.ty-heli.y)<60)heli.active=false;
  }

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.x+=b.vx;b.y+=b.vy;
    if(b.x<0||b.x>m.w||b.y<0||b.y>m.h){bullets.splice(i,1);continue;}
    let wall=false;for(let o of m.obs)if(!o.lava&&cRect(b.x,b.y,b.r,o.x,o.y,o.w,o.h)){wall=true;spawnPart(b.x,b.y,'#aaa',4,.5);break;}
    if(wall&&!b.pierce){bullets.splice(i,1);continue;}
    let hit=false;
    for(let j=enemies.length-1;j>=0;j--){
      const z=enemies[j];if(z.faction===b.owner)continue;
      if(Math.hypot(b.x-z.x,b.y-z.y)<z.radius+b.r){
        if(z.type===4&&Math.random()<.4){spawnPart(z.x,z.y,'#4488ff',5);break;}
        const isCrit=Math.random()<(b.critChance||0);
        const d=b.dmg*(isCrit?2:1);
        z.hp-=d;
        addDmgNum(z.x,z.y-16,Math.ceil(d),isCrit?{r:255,g:220,b:0}:{r:255,g:150,b:150},isCrit?20:14,isCrit);
        if(isCrit)sfx('crit');
        if(b.aoe)boom(b.x,b.y,60,b.dmg*.5,b.owner);
        spawnPart(b.x,b.y,'#990000',6,1);
        if(!b.pierce){bullets.splice(i,1);hit=true;}
        if(z.hp<=0)killEnemy(j);
        if(hit)break;
      }
    }
    if(hit)continue;
    if(b.owner!==player.faction&&Math.hypot(b.x-player.x,b.y-player.y)<player.radius+b.r){
      if(player.fx.shield>0){player.shield=Math.max(0,player.shield-b.dmg*.3);sfx('shield');spawnPart(player.x,player.y,'#4488ff',5);}
      else if(player.invTimer<=0){
        player.hp-=b.dmg;player.perfectWave=false;blood(player.x,player.y,2);
        addDmgNum(player.x,player.y-20,Math.ceil(b.dmg),{r:255,g:80,b:80},16);
        if(player.hp<=0)killPlayer();
      }
      bullets.splice(i,1);
    }
  }

  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];r.x+=r.vx;r.y+=r.vy;r.life--;
    if(frame%2===0)spawnPart(r.x,r.y,'#ff6600',3,.5);
    let xp=r.life<=0||r.x<0||r.x>m.w||r.y<0||r.y>m.h;
    if(!xp){for(let o of m.obs)if(!o.lava&&cRect(r.x,r.y,r.r,o.x,o.y,o.w,o.h)){xp=true;break;}for(let z of enemies)if(z.faction!==r.owner&&Math.hypot(r.x-z.x,r.y-z.y)<z.radius+r.r){xp=true;break;}}
    if(xp){boom(r.x,r.y,100,r.dmg,r.owner);rockets.splice(i,1);}
  }

  for(let i=flames.length-1;i>=0;i--){
    const f=flames[i];f.x+=f.vx;f.y+=f.vy;f.vx*=.93;f.vy*=.93;f.life-=.04;f.r+=.3;
    if(f.life<=0){flames.splice(i,1);continue;}
    for(let j=enemies.length-1;j>=0;j--){const z=enemies[j];if(z.faction===f.owner)continue;if(Math.hypot(f.x-z.x,f.y-z.y)<z.radius+f.r){z.hp-=f.dmg;z.burnTimer=90;if(z.hp<=0)killEnemy(j);}}
  }

  for(let i=grenades.length-1;i>=0;i--){const g=grenades[i];g.x+=g.vx;g.y+=g.vy;g.z+=g.vz;g.vz-=.28;g.timer--;if(g.z<=0||g.timer<=0){boom(g.x,g.y,90,55,g.owner);grenades.splice(i,1);}}

  if(!sandbox.aiEnabled&&gameMode==='SANDBOX')goto_particles();
  else updateEnemies(m,now,D);
  goto_particles();

  if(frame%3===0)broadcastPlayerState();
}

function goto_particles(){
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.9;p.vy*=.9;p.a-=p.dec;if(p.a<=0)particles.splice(i,1);}
  for(let i=dmgNums.length-1;i>=0;i--){const d=dmgNums[i];d.y+=d.vy;d.vy*=.92;d.a-=1/d.life;if(d.a<=0)dmgNums.splice(i,1);}
  if(selectedMap===3&&frame%4===0)MAPS[3].obs.forEach(o=>{if(o.lava)lavaParts.push({x:o.x+Math.random()*o.w,y:o.y+Math.random()*o.h,vy:-1-Math.random()*2,vx:(Math.random()-.5)*1.5,life:1,r:Math.random()*4+2});});
  for(let i=lavaParts.length-1;i>=0;i--){lavaParts[i].y+=lavaParts[i].vy;lavaParts[i].x+=lavaParts[i].vx;lavaParts[i].life-=.03;if(lavaParts[i].life<=0)lavaParts.splice(i,1);}
  updateWeather();
  for(let i=pendingAchievements.length-1;i>=0;i--){pendingAchievements[i].timer--;if(pendingAchievements[i].timer<=0)pendingAchievements.splice(i,1);}
}

function updateWeather(){
  const m=MAPS[selectedMap];
  if(m.amb==='rain'||m.amb==='crickets'){
    if(frame%2===0){const rx=cam.x+Math.random()*W,ry=cam.y+Math.random()*H;weatherParts.push({x:rx,y:ry,vx:m.amb==='rain'?-1:0,vy:m.amb==='rain'?18:0,life:1,type:m.amb});}
  }
  if(m.amb==='wind'&&frame%3===0){weatherParts.push({x:cam.x+Math.random()*W,y:cam.y+Math.random()*H,vx:(Math.random()-.5)*2,vy:-1-Math.random(),life:1,type:'snow'});}
  for(let i=weatherParts.length-1;i>=0;i--){const p=weatherParts[i];p.x+=p.vx;p.y+=p.vy;p.life-=.02;if(p.life<=0||p.y>cam.y+H+20||p.y<cam.y-20)weatherParts.splice(i,1);}
  if(weatherParts.length>400)weatherParts.splice(0,50);
}

function updateEnemies(m,now,D){
  for(let i=enemies.length-1;i>=0;i--){
    const z=enemies[i];
    let tx=player.x,ty=player.y;
    let targetIsPlayer=true;
    if(z.faction===player.faction){
      let best=null,bd=Infinity;
      for(let e2 of enemies){if(e2.faction!==z.faction){const dd=Math.hypot(e2.x-z.x,e2.y-z.y);if(dd<bd){bd=dd;best=e2;}}}
      if(best){tx=best.x;ty=best.y;targetIsPlayer=false;}
      else{tx=player.x+Math.sin(frame*.02+i)*200;ty=player.y+Math.cos(frame*.02+i)*200;}
    }
    const za=Math.atan2(ty-z.y,tx-z.x);z.ang=za;
    const dist=Math.hypot(tx-z.x,ty-z.y);
    const spd=(z.slowTimer>0?z.speed*.45:z.speed)*D.spdMult;
    if(z.slowTimer>0)z.slowTimer--;
    if(z.burnTimer>0){z.burnTimer--;if(frame%15===0){z.hp-=3;spawnPart(z.x,z.y,'#ff4400',2,.6);if(z.hp<=0){killEnemy(i);continue;}}}

    switch(z.def.ai){
      case 'melee':z.x+=Math.cos(za)*spd;z.y+=Math.sin(za)*spd;break;
      case 'charge':
        if(!z.charging&&dist<130){z.charging=true;z.chargeDir={vx:Math.cos(za)*9,vy:Math.sin(za)*9};z.chargeTimer=18;}
        if(z.charging){z.x+=z.chargeDir.vx;z.y+=z.chargeDir.vy;z.chargeTimer--;if(z.chargeTimer<=0)z.charging=false;}
        else{z.x+=Math.cos(za)*spd;z.y+=Math.sin(za)*spd;}break;
      case 'ranged':
        if(dist>200){z.x+=Math.cos(za)*spd*.5;z.y+=Math.sin(za)*spd*.5;}
        if(now-z.lastFire>2200){z.lastFire=now;grenades.push({x:z.x,y:z.y,z:10,vx:Math.cos(za)*8.5,vy:Math.sin(za)*8.5,vz:5.5,timer:70,owner:z.faction});}break;
      case 'sniper':
        if(dist<350){z.x-=Math.cos(za)*spd*.8;z.y-=Math.sin(za)*spd*.8;}
        else if(dist>500){z.x+=Math.cos(za)*spd*.5;z.y+=Math.sin(za)*spd*.5;}
        if(now-z.lastFire>2800){z.lastFire=now;bullets.push({x:z.x,y:z.y,vx:Math.cos(za)*20,vy:Math.sin(za)*20,r:4,dmg:28*D.dmgMult,pierce:false,aoe:false,col:'#8888ff',owner:z.faction,critChance:0});}break;
      case 'ghost':
        if(z.hp<z.maxHp*.3&&now-z.lastSp>3000){z.lastSp=now;z.x=tx+(Math.random()-.5)*300;z.y=ty+(Math.random()-.5)*300;}
        z.x+=Math.cos(za)*spd;z.y+=Math.sin(za)*spd;break;
      case 'suicide':
        z.x+=Math.cos(za)*spd;z.y+=Math.sin(za)*spd;
        if(dist<48){boom(z.x,z.y,80,45*D.dmgMult,z.faction);enemies.splice(i,1);continue;}
        if(frame%8===0)spawnPart(z.x,z.y,'#ff8800',2,.5);break;
      case 'heavy':
        z.x+=Math.cos(za)*spd;z.y+=Math.sin(za)*spd;
        if(dist<220&&now-z.lastSp>3500){z.lastSp=now;sfx('stomp');boom(z.x,z.y,130,30*D.dmgMult,z.faction);sShake=Math.max(sShake,22);}break;
      case 'support':
        if(dist>300){z.x+=Math.cos(za)*spd*.6;z.y+=Math.sin(za)*spd*.6;}
        if(now-z.lastSp>5000&&enemies.length<80){z.lastSp=now;spawnPart(z.x,z.y,'#aa00aa',12,1.2);const a2=Math.random()*Math.PI*2;spawnEnemy(z.x+Math.cos(a2)*80,z.y+Math.sin(a2)*80,0,z.faction);}
        if(now-z.lastFire>1800){z.lastFire=now;bullets.push({x:z.x,y:z.y,vx:Math.cos(za)*12,vy:Math.sin(za)*12,r:5,dmg:15*D.dmgMult,pierce:false,aoe:false,col:'#aa00aa',owner:z.faction,critChance:0});}break;
      case 'boss':
        z.x+=Math.cos(za)*spd;z.y+=Math.sin(za)*spd;
        const shots=z.type===5?3:1;
        if(now-z.lastFire>(z.type===5?1400:1800)){z.lastFire=now;for(let s=0;s<shots;s++){const a2=za+(s-1)*.35;grenades.push({x:z.x,y:z.y,z:14,vx:Math.cos(a2)*(z.type===5?10:8.5),vy:Math.sin(a2)*(z.type===5?10:8.5),vz:6,timer:80,owner:z.faction});}}
        if(z.def.titan){
          if(now-z.lastFire>800){z.lastFire=now;for(let s=0;s<5;s++){const a2=za+(s-2)*.3;grenades.push({x:z.x,y:z.y,z:16,vx:Math.cos(a2)*11,vy:Math.sin(a2)*11,vz:6,timer:85,owner:z.faction});}}
          if(now-z.lastSp>4000){z.lastSp=now;sfx('stomp');sShake=30;boom(z.x,z.y,160,40*D.dmgMult,z.faction);for(let s=0;s<3;s++)spawnEnemy(z.x+(Math.random()-.5)*200,z.y+(Math.random()-.5)*200,0,z.faction);}
          if(frame%3===0)spawnPart(z.x,z.y,'#ff0000',3,.8);
        }break;
    }
    m.obs.forEach(o=>{if(!o.lava)rCol(z,o);});
    z.x=Math.max(60,Math.min(m.w-60,z.x));z.y=Math.max(60,Math.min(m.h-60,z.y));

    if(targetIsPlayer&&dist<player.radius+z.radius+8&&now-z.lastAttack>700){
      z.lastAttack=now;
      if(z.faction===player.faction)continue;
      const d=z.def.dmg*(z.isBoss?3:1)*D.dmgMult;
      if(player.fx.shield>0){player.shield=Math.max(0,player.shield-d*20);sfx('shield');spawnPart(player.x,player.y,'#4488ff',6);}
      else if(player.invTimer<=0){
        player.hp-=d;player.perfectWave=false;blood(player.x,player.y,3);
        addDmgNum(player.x,player.y-20,Math.ceil(d),{r:255,g:80,b:80},16);
        if(player.hp<=0)killPlayer();
      }
    }
    if(!targetIsPlayer&&dist<z.radius+12&&now-z.lastAttack>700){
      z.lastAttack=now;
      for(let j=enemies.length-1;j>=0;j--){
        const e2=enemies[j];if(e2.faction===z.faction)continue;
        if(Math.hypot(e2.x-z.x,e2.y-z.y)<z.radius+e2.radius+8){
          e2.hp-=z.def.dmg*(z.isBoss?3:1);spawnPart(e2.x,e2.y,'#cc0000',4,.8);
          if(e2.hp<=0)killEnemy(j);break;
        }
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════
// DRAW
// ═══════════════════════════════════════════════════════════
function draw(){
  ctx.clearRect(0,0,W,H);
  if(state==='MENU'){drawMenu();return;}
  if(state==='LOBBY'){drawLobby();return;}
  if(state==='PAUSED'){drawPause();return;}

  const m=MAPS[selectedMap];
  ctx.save();
  const sx=sShake>0?(Math.random()-.5)*sShake:0,sy=sShake>0?(Math.random()-.5)*sShake:0;
  ctx.translate(-cam.x+sx,-cam.y+sy);

  ctx.fillStyle=m.bg;ctx.fillRect(0,0,m.w,m.h);
  ctx.strokeStyle=m.grid;ctx.lineWidth=1;
  for(let i=0;i<m.w;i+=m.gs){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,m.h);ctx.stroke();}
  for(let j=0;j<m.h;j+=m.gs){ctx.beginPath();ctx.moveTo(0,j);ctx.lineTo(m.w,j);ctx.stroke();}
  if(m.floorDecals)m.floorDecals.forEach(d=>{ctx.fillStyle=d.col;ctx.font='bold 60px sans-serif';ctx.textAlign='center';ctx.fillText(d.txt,d.x,d.y);});

  weatherParts.forEach(p=>{
    ctx.globalAlpha=p.life*.5;
    if(p.type==='rain'){ctx.strokeStyle='rgba(150,180,255,0.4)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+p.vx*3,p.y+p.vy*3);ctx.stroke();}
    else if(p.type==='snow'){ctx.fillStyle='rgba(230,240,255,0.7)';ctx.beginPath();ctx.arc(p.x,p.y,1.5,0,Math.PI*2);ctx.fill();}
    else if(p.type==='crickets'){ctx.fillStyle='rgba(255,220,100,0.3)';ctx.beginPath();ctx.arc(p.x,p.y,1,0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;
  });

  if(selectedMap===3){
    m.obs.forEach(o=>{if(!o.lava)return;const lp=frame*.04;const g=ctx.createRadialGradient(o.x+o.w/2+Math.sin(lp)*20,o.y+o.h/2+Math.cos(lp)*15,0,o.x+o.w/2,o.y+o.h/2,Math.max(o.w,o.h));g.addColorStop(0,'#ff6600');g.addColorStop(.5,'#cc2200');g.addColorStop(1,'#880000');ctx.fillStyle=g;ctx.fillRect(o.x,o.y,o.w,o.h);});
    lavaParts.forEach(p=>{ctx.globalAlpha=p.life*.7;ctx.fillStyle=p.life>.5?'#ff8800':'#ff4400';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;
  }

  bloodPools.forEach(p=>{ctx.fillStyle=`rgba(70,0,0,${p.d})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});
  drawTrees(m,false);

  const shx=Math.cos(m.sunA)*m.shL,shy=Math.sin(m.sunA)*m.shL;
  ctx.fillStyle='rgba(0,0,0,0.38)';
  enemies.forEach(z=>{ctx.beginPath();ctx.arc(z.x+shx,z.y+shy,z.radius,0,Math.PI*2);ctx.fill();});
  ctx.beginPath();ctx.arc(player.x+shx,player.y+shy,player.radius,0,Math.PI*2);ctx.fill();
  m.obs.forEach(o=>{if(!o.lava)ctx.fillRect(o.x+shx,o.y+shy,o.w,o.h);});

  powerups.forEach(p=>{if(p.dead)return;const pulse=Math.sin(p.pulse)*5;ctx.save();ctx.translate(p.x,p.y);const g=ctx.createRadialGradient(0,0,2,0,0,18+pulse);g.addColorStop(0,p.type.col);g.addColorStop(1,p.type.col+'00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,18+pulse,0,Math.PI*2);ctx.fill();ctx.strokeStyle=p.type.col;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.stroke();ctx.fillStyle=p.type.col;ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText(p.type.icon,0,5);ctx.restore();});

  crates.forEach(c=>{
    const pulse=Math.sin(c.pulse||0)*4;
    ctx.fillStyle='#5a3818';ctx.fillRect(c.x-c.size/2,c.y-c.size/2,c.size,c.size);
    ctx.strokeStyle='#00ff88';ctx.lineWidth=2+pulse*.3;ctx.strokeRect(c.x-c.size/2-1,c.y-c.size/2-1,c.size+2,c.size+2);
    ctx.fillStyle='rgba(0,255,136,0.15)';ctx.fillRect(c.x-c.size/2,c.y-c.size/2,c.size,c.size);
    ctx.fillStyle='#00ff88';ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.fillText('SHOP',c.x,c.y+4);
    if(Math.hypot(player.x-c.x,player.y-c.y)<90){
      const by=c.y-c.size/2-38;
      ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(c.x-34,by,68,26);
      ctx.strokeStyle='#00ff88';ctx.lineWidth=1;ctx.strokeRect(c.x-34,by,68,26);
      ctx.fillStyle='#00ff88';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('[E] OPEN',c.x,by+18);
    }
  });

  bullets.forEach(b=>{ctx.fillStyle=b.col||'#ffdd44';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();});
  rockets.forEach(r=>{ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.ang);ctx.fillStyle='#cc5500';ctx.fillRect(-8,-3,16,6);ctx.fillStyle='#ffaa00';ctx.beginPath();ctx.arc(-8,0,4,0,Math.PI*2);ctx.fill();ctx.restore();});
  flames.forEach(f=>{ctx.globalAlpha=f.life*.8;const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);g.addColorStop(0,'#fff');g.addColorStop(.3,'#ff8800');g.addColorStop(1,'rgba(200,30,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;});
  grenades.forEach(g=>{ctx.fillStyle='rgba(0,0,0,0.4)';ctx.beginPath();ctx.arc(g.x+shx/2,g.y+shy/2,4,0,Math.PI*2);ctx.fill();ctx.fillStyle=g.vz>0?'#225522':'#664422';ctx.beginPath();ctx.arc(g.x,g.y-g.z,4*(1+g.z/40),0,Math.PI*2);ctx.fill();if(frame%8<4){spawnPart(g.x,g.y-g.z,'#ffaa00',1,.3);}});

  if(gameMode==='SANDBOX'&&sandbox.cursor.active){const def=EDEFS[sandbox.cursor.type]||EDEFS[0];ctx.save();ctx.translate(mouse.wx,mouse.wy);ctx.globalAlpha=.5+Math.sin(frame*.1)*.2;ctx.strokeStyle=sandbox.cursor.faction==='player'?'#00ff88':'#ff4444';ctx.lineWidth=2;ctx.setLineDash([5,5]);ctx.beginPath();ctx.arc(0,0,def.r,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;ctx.restore();}

  drawEnemies(shx);
  drawPlayer();

  Object.values(remotePlayers).forEach(rp=>{
    if(!rp.alive)return;
    ctx.save();ctx.translate(rp.x,rp.y);ctx.rotate(rp.angle);
    ctx.fillStyle='#ff8800';ctx.beginPath();ctx.arc(0,0,15,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#8a8a9a';ctx.fillRect(14,-3,18,5);
    ctx.restore();
    ctx.fillStyle='#ffaa00';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText(rp.name,rp.x,rp.y-20);
  });

  m.obs.forEach(o=>{
    if(o.lava)return;
    ctx.fillStyle=m.obsC||'#2a2a38';ctx.fillRect(o.x,o.y,o.w,o.h);
    if(o.decals)o.decals.forEach(d=>{ctx.fillStyle=d.c;ctx.beginPath();ctx.arc(o.x+d.x,o.y+d.y,d.r,0,Math.PI*2);ctx.fill();});
    ctx.fillStyle=m.roofC||'#38384a';ctx.fillRect(o.x,o.y-42,o.w,o.h);
  });
  drawTrees(m,true);

  if(heli.active){ctx.save();ctx.translate(heli.x,heli.y);ctx.rotate(heli.ang);ctx.fillStyle='#334';ctx.fillRect(-45,-16,90,32);ctx.fillStyle='#112';ctx.fillRect(22,-11,16,22);ctx.strokeStyle='rgba(200,200,200,0.25)';const rot=frame*.3;for(let b=0;b<3;b++){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(rot+b*2.09)*52,Math.sin(rot+b*2.09)*52);ctx.lineWidth=2;ctx.stroke();}ctx.restore();}

  particles.forEach(p=>{ctx.globalAlpha=p.a;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;
  dmgNums.forEach(d=>{ctx.globalAlpha=d.a;ctx.fillStyle=`rgb(${d.r},${d.g},${d.b})`;ctx.font=`bold ${d.size}px sans-serif`;ctx.textAlign='center';if(d.isCrit){ctx.strokeStyle='rgba(0,0,0,0.8)';ctx.lineWidth=3;ctx.strokeText(d.txt,d.x,d.y);}ctx.fillText(d.txt,d.x,d.y);});ctx.globalAlpha=1;

  drawFog(m);
  ctx.restore();

  if(sFlash.a>0){ctx.fillStyle=sFlash.col;ctx.globalAlpha=sFlash.a*.4;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}

  drawThreatIndicators();

  if(inShop&&!sandbox.open)drawShop();
  else drawHUD();

  if(gameMode==='SANDBOX'&&sandbox.open)drawSandbox();
  else if(gameMode==='SANDBOX')drawSandboxHint();

  if(waveAnn>0&&!sandbox.open)drawWaveAnn();
  if(isInter&&!inShop&&!sandbox.open)drawInter();

  if(gameMode==='SURVIVAL'&&!inShop&&!sandbox.open)drawMinimap();

  drawAchievements();

  if(state==='LEVELUP')drawLevelUp();
  if(state==='GAMEOVER')drawGameOver();
}

function drawThreatIndicators(){
  enemies.forEach(z=>{
    if(z.faction===player.faction)return;
    const sx=z.x-cam.x,sy=z.y-cam.y;
    if(sx>-20&&sx<W+20&&sy>-20&&sy<H+20)return;
    const ang=Math.atan2(sy-H/2,sx-W/2);
    const margin=30;
    const cx=W/2+Math.cos(ang)*Math.min(Math.abs(W/2/Math.cos(ang)),Math.abs(H/2/Math.sin(ang)))-Math.cos(ang)*margin;
    const cy=H/2+Math.sin(ang)*Math.min(Math.abs(W/2/Math.cos(ang)),Math.abs(H/2/Math.sin(ang)))-Math.sin(ang)*margin;
    const ex=Math.max(margin,Math.min(W-margin,cx)),ey=Math.max(margin+70,Math.min(H-margin-80,cy));
    ctx.save();ctx.translate(ex,ey);ctx.rotate(ang);
    ctx.fillStyle=z.isBoss?'#ff4400':'rgba(255,80,80,0.7)';
    ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-8,-6);ctx.lineTo(-8,6);ctx.closePath();ctx.fill();
    ctx.restore();
  });
}

function drawMinimap(){
  const m=MAPS[selectedMap];
  const mw=180,mh=130,mx=W-mw-16,my=70;
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(mx,my,mw,mh);
  ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.strokeRect(mx,my,mw,mh);
  const sx=mw/m.w,sy=mh/m.h;
  ctx.fillStyle='rgba(80,80,100,0.6)';
  m.obs.forEach(o=>{if(o.lava){ctx.fillStyle='rgba(200,80,0,0.5)';}else ctx.fillStyle='rgba(80,80,100,0.5)';ctx.fillRect(mx+o.x*sx,my+o.y*sy,Math.max(1,o.w*sx),Math.max(1,o.h*sy));});
  enemies.forEach(z=>{ctx.fillStyle=z.faction===player.faction?'#00ff88':'#ff4444';ctx.beginPath();ctx.arc(mx+z.x*sx,my+z.y*sy,z.isBoss?3:2,0,Math.PI*2);ctx.fill();});
  crates.forEach(c=>{ctx.fillStyle='#00ffcc';ctx.beginPath();ctx.arc(mx+c.x*sx,my+c.y*sy,3,0,Math.PI*2);ctx.fill();});
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(mx+player.x*sx,my+player.y*sy,3,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.strokeRect(mx+cam.x*sx,my+cam.y*sy,W*sx,H*sy);
  ctx.fillStyle='#556';ctx.font='9px sans-serif';ctx.textAlign='center';ctx.fillText('MAP',mx+mw/2,my+mh+12);
}

function drawTrees(m,top){

  m.trees.forEach(t=>{
    const tshx=Math.cos(m.sunA)*m.shL*1.5,tshy=Math.sin(m.sunA)*m.shL*1.5;
    if(!top){
      ctx.fillStyle='rgba(0,0,0,0.28)';ctx.beginPath();ctx.ellipse(t.x+tshx,t.y+tshy,t.r*.5,t.r*.3,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=t.dead?'#3a2a18':'#5a3a1e';ctx.fillRect(t.x-5,t.y-6,10,18);
    }else{
      if(t.dead){
        ctx.strokeStyle='#3a2a18';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(t.x,t.y);ctx.lineTo(t.x,t.y-t.r*1.8);ctx.stroke();
        ctx.lineWidth=2;[[-.6,-1.2],[.7,-1.1],[-.4,-.7],[.5,-.6]].forEach(([dx,dy])=>{ctx.beginPath();ctx.moveTo(t.x,t.y+dy*t.r*.7);ctx.lineTo(t.x+dx*t.r,t.y+dy*t.r);ctx.stroke();});
      }else{
        ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.arc(t.x+tshx*.3,t.y+tshy*.3,t.r+3,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=t.snow?'#b0c8d8':m.sunA>Math.PI*.6?'#2a5a2a':'#1e4a1e';ctx.beginPath();ctx.arc(t.x,t.y+4,t.r,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=t.snow?'#d0e4f0':m.sunA>Math.PI*.6?'#2e6a2e':'#226622';ctx.beginPath();ctx.arc(t.x-1,t.y-2,t.r*.85,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=t.snow?'#f0f6fa':'#338833';ctx.beginPath();ctx.arc(t.x-2,t.y-t.r*.25,t.r*.6,0,Math.PI*2);ctx.fill();
        if(t.snow){ctx.fillStyle='rgba(240,248,255,0.88)';ctx.beginPath();ctx.arc(t.x-1,t.y-t.r*.4,t.r*.5,Math.PI,0);ctx.fill();}

function drawPlayer(){
  ctx.save();ctx.translate(player.x,player.y);
  if(player.fx.invis>0)ctx.globalAlpha=.28;
  ctx.rotate(player.angle);
  if(player.fx.shield>0){ctx.globalAlpha*=.3;ctx.fillStyle='#4488ff';ctx.beginPath();ctx.arc(0,0,player.radius+10,0,Math.PI*2);ctx.fill();ctx.globalAlpha=player.fx.invis>0?.28:1;}
  ctx.strokeStyle=player.faction==='player'?'#00ff88':'#ff4444';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,player.radius+5,0,Math.PI*2);ctx.stroke();
  drawWeaponSprite();
  if(player.morphType!==null){const def=EDEFS[player.morphType];ctx.fillStyle=player.faction==='reborn'?def.col:'#22aa55';ctx.beginPath();ctx.arc(0,0,player.radius,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText(def.name.slice(0,3),0,4);}
  else{ctx.fillStyle=player.faction==='player'?'#1f4a3a':'#4a1a1a';ctx.beginPath();ctx.arc(0,0,player.radius,0,Math.PI*2);ctx.fill();ctx.fillStyle='#cda989';ctx.beginPath();ctx.arc(0,0,player.radius-5,0,Math.PI*2);ctx.fill();}
  if(player.burnTimer>0&&frame%6<3){ctx.globalAlpha*=.5;ctx.fillStyle='#ff4400';ctx.beginPath();ctx.arc(0,0,player.radius+3,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;ctx.restore();

  ctx.save();ctx.fillStyle=player.faction==='player'?'#00ff88':'#ff4444';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
  ctx.fillText(player.faction==='player'?'▲ YOU':'▲ REBORN',player.x-cam.x,player.y-cam.y-player.radius-12);ctx.restore();
}

  ctx.fillStyle='#00ff88';ctx.font='bold 48px sans-serif';ctx.fillText('LOBBY',W/2,100);
  
  ctx.fillStyle='#888';ctx.font='18px sans-serif';ctx.fillText(`Lobby Code: ${lobbyCode}`,W/2,160);
  ctx.fillText(`Players: ${Object.keys(remotePlayers).length+1}`,W/2,190);
  
  ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fillRect(W/2-200,220,400,300);
  ctx.strokeStyle='#00ff88';ctx.lineWidth=2;ctx.strokeRect(W/2-200,220,400,300);
  
  ctx.fillStyle='#00ff88';ctx.font='bold 16px sans-serif';ctx.textAlign='left';
  ctx.fillText(`• ${playerName} (YOU${isHost?' - HOST':''})`,W/2-180,250);
  
  let py=280;
  Object.values(remotePlayers).forEach(rp=>{
    ctx.fillStyle='#ffaa00';ctx.fillText(`• ${rp.name}`,W/2-180,py);
    py+=30;
  });
  
  if(isHost){
    ctx.fillStyle='rgba(0,255,100,0.2)';ctx.fillRect(W/2-100,H-100,200,50);
    ctx.strokeStyle='#00ff88';ctx.lineWidth=2;ctx.strokeRect(W/2-100,H-100,200,50);
    ctx.fillStyle='#00ff88';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText('START GAME',W/2,H-68);
  }else{
    ctx.fillStyle='#888';ctx.font='16px sans-serif';ctx.textAlign='center';ctx.fillText('Waiting for host to start...',W/2,H-75);
  }
}

function drawGameOver(){
  ctx.fillStyle='rgba(4,0,0,0.95)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle=`hsl(0,80%,${30+Math.sin(frame*.05)*15}%)`;ctx.font='bold 94px sans-serif';ctx.fillText('TORN',W/2,H/2-115);
  ctx.fillStyle='#880000';ctx.fillText('APART',W/2,H/2-15);
  const stats=[`WAVE: ${player.wave}`,`SCORE: ${player.score}`,`KILLS: ${player.kills}`,`LEVEL: ${player.level}`,`BEST STREAK: ${player.streak}`];
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(W/2-240,H/2+20,480,130);
  ctx.strokeStyle='#440000';ctx.lineWidth=1;ctx.strokeRect(W/2-240,H/2+20,480,130);
  stats.forEach((s,i)=>{ctx.fillStyle=i===0?'#ff6666':i===1?'#ffaa44':'#aaa';ctx.font=i<2?'bold 22px sans-serif':'bold 17px sans-serif';ctx.fillText(s,W/2-100+i%2*200,H/2+52+Math.floor(i/2)*36);});
  if(player.score>=HS.highScore){ctx.fillStyle='#ffcc00';ctx.font='bold 18px sans-serif';ctx.fillText('★ NEW HIGH SCORE! ★',W/2,H/2+165);}
  if(player.wave>=HS.bestWave){ctx.fillStyle='#aaddff';ctx.font='bold 16px sans-serif';ctx.fillText('★ NEW BEST WAVE! ★',W/2,H/2+188);}
  ctx.fillStyle='#555';ctx.font='16px sans-serif';ctx.fillText('SPACE or ENTER to return to menu',W/2,H/2+220);
}

initPeer();
loop();
